name: Schedule Test

on:
  schedule:
    - cron: "25 13 * * *"
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Print test message
        run: |
          echo "================================"
          echo "触发方式：${{ github.event_name }}"
          echo "当前 UTC 时间：$(date -u)"
          echo "当前北京时间：$(date '+%Y-%m-%d %H:%M:%S')"
          echo "================================"
