name: X to Telegram Sync

on:

  # GitHub 定时运行
  # 每小时的 2、7、12、17、22……57 分执行
  schedule:
    - cron: "2-59/5 * * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:


permissions:
  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 测试任务
      # ======================================================

      - name: Test scheduled run

        run: |
          echo "========================================"
          echo "GitHub Actions 测试成功！"
          echo "当前 UTC 时间：$(date -u)"
          echo "当前北京时间：$(TZ=Asia/Shanghai date)"
          echo "========================================"


      # ======================================================
      # 下载仓库
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # 安装依赖
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 运行同步程序
      # ======================================================

      - name: Run Twitter to Telegram

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python main.py


      # ======================================================
      # 保存 sent.json
      # ======================================================

      - name: Save sent.json

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent.json

          git diff --cached --quiet || git commit -m "Update sent tweet IDs"

          git push